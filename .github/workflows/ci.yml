name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.13.6
          enable-cache: true
      - id: sync
        run: uv sync --locked
      - id: ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - id: mypy
        run: uv run mypy
      - id: sqlfluff
        run: uv run sqlfluff lint db
      - id: gitleaks
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --quiet
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner --config .gitleaks.toml .
      - id: bronze
        run: make bronze-check
      - id: pytest
        run: uv run pytest -m "not db"

  db:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.13.6
          enable-cache: true
      - id: setup
        run: make setup
      - id: env
        run: |
          password() {
            printf 'P%s' "$(head -c 96 /dev/urandom | base64 -w0 | tr -dc 'A-Za-z0-9' | cut -c1-23)"
          }
          printf 'SRDWH_ENV=ci\nSRDWH_DSN=localhost:1521/FREEPDB1\n' > .env
          for name in ORACLE SRDWH_OWNER SRDWH_ETL ANALYST_CORP ANALYST_RETAIL RISK_MANAGER AUDITOR PROBE_NOPROFILE; do
            value="$(password)"
            echo "::add-mask::${value}"
            echo "${name}_PASSWORD=${value}" >> .env
          done
      - id: up
        run: make up
      - id: tests
        run: make test PYTEST_ARGS="--cov=srdwh --cov-report=term --cov-fail-under=80"
      - id: e2e
        run: make e2e PROFILE=ci
      - id: reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: junit
          path: reports/
      - id: logs
        if: failure()
        run: docker compose logs --no-log-prefix oracle | grep -v PASSWORD | tail -200
