name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.6
          enable-cache: true
      - id: sync
        run: uv sync --locked
      - id: ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - id: mypy
        run: uv run mypy
      - id: sqlfluff
        run: uv run sqlfluff lint db
      - id: gitleaks
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --quiet
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner --config .gitleaks.toml .
      - id: bronze
        run: make bronze-check
      - id: pytest
        run: uv run pytest -m "not db"
