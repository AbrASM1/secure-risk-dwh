[project]
name = "srdwh"
version = "0.1.0"
description = "Credit-risk data platform on Oracle: feeds, medallion warehouse, standardised RWA, access controls"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2",
    "oracledb>=3.4",
    "pandera[polars]>=0.19",
    "polars>=1",
    "pyarrow>=17",
    "typer>=0.12",
]

[project.scripts]
srdwh = "srdwh.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5",
    "ruff>=0.6",
    "sqlfluff>=3.2",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C90", "N", "SIM", "RUF", "PT", "S"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S608"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "db: needs the Oracle container",
    "perf: measured on the dev profile",
]

[tool.coverage.run]
source = ["srdwh"]
branch = true

[tool.coverage.report]
show_missing = true
